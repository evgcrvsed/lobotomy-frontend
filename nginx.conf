server {
    listen 80;

    client_max_body_size 300m;

    # Ограничение доступа по IP. Значение подставляется из переменной ALLOWED_IP
    # (задаётся в .env на сервере). По умолчанию 0.0.0.0/0 — сайт открыт всем.
    # Чтобы пустить только себя: ALLOWED_IP=ваш.статический.ip
    allow ${ALLOWED_IP};
    deny all;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие текстовых ответов: JS сайта весит ~410 КБ, сжатый — ~115 КБ.
    # Картинки (webp/png/jpg) уже сжаты — их не трогаем, только время тратить.
    # gzip_proxied any — сжимать и ответы бэкенда (/api/), и запросы, пришедшие
    # через Caddy: без этого nginx их пропускает как «пришедшие через прокси».
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API и статика бэкенда — проксируем на контейнер FastAPI
    # ("backend" — имя сервиса из docker-compose)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Фото товаров и коллекций. Имя файла случайное и при замене фото меняется
    # (новый файл — новое имя), поэтому браузер может держать их у себя долго
    # и при повторном заходе не качать заново.
    location /static/ {
        proxy_pass http://backend:8000;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Сборка Vite: в имени файла хэш содержимого (index-B_8DZBaa.js), и после
    # любой правки имя другое. Значит, файл по этому адресу не меняется никогда —
    # кэшируем «навсегда», браузер даже не переспрашивает сервер.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Всё остальное — React SPA (роутинг на клиенте).
    # index.html кэшировать нельзя: именно в нём ссылки на свежие файлы из
    # /assets/. no-cache = «храни, но перед показом сверься с сервером» — без
    # изменений сервер ответит коротким 304, так что это почти бесплатно.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

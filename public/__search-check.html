<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>orders search layout check</title>
<link rel="stylesheet" href="/src/styles/base.css" />
<link rel="stylesheet" href="/src/styles/pages/admin.css" />
<link rel="stylesheet" href="/src/styles/pages/admin-orders.css" />
</head>
<body>
<div class="admin-page">
  <div class="admin-page__top"><h1 class="admin-page__title">Заказы</h1></div>

  <div class="admin-orders__search">
    <input class="admin-orders__search-input" type="search" placeholder="Поиск по номеру, ФИО, почте или телефону" value="Иванов" />
    <button type="button" class="btn btn--outline">Сбросить</button>
  </div>

  <div class="admin-filters">
    <button class="admin-filter admin-filter--active">Все</button>
    <button class="admin-filter">В работе</button>
    <button class="admin-filter">Отправленные</button>
    <button class="admin-filter">Готовы к выдаче</button>
    <button class="admin-filter">Ожидают оплаты</button>
  </div>

  <p class="admin-orders__note">Поиск идёт по всем заказам, включая вручённые и отменённые.</p>
  <p class="admin-empty">Ничего не найдено</p>
</div>
</body>
</html>
